# GitVersion 6.x configuration (consumed by gittools/actions@v3 in CI).
# Extends the built-in GitFlow/v1 workflow and overrides only the pre-release labels,
# so each branch yields a distinct, self-describing SemVer:
#   main            -> 1.4.0                 (stable release, tagged v1.4.0)
#   dev             -> 1.5.0-dev.3           (integration pre-release)
#   feature/xyz     -> 1.5.0-xyz.2           (labelled with the branch name)
#   hotfix/abc      -> 1.4.1-beta.1          (patch pre-release off main)
#   PR builds       -> 1.5.0-PullRequest.42
workflow: GitFlow/v1
next-version: 1.0.0
tag-prefix: '[vV]'

branches:
  main:
    label: ''
  develop:
    # Matches a branch literally named `dev` (as well as develop/development).
    regex: ^dev(elop)?(ment)?$
    label: dev
    increment: Minor
  feature:
    label: '{BranchName}'
  hotfix:
    label: beta
