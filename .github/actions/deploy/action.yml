name: Deploy Environment
description: >
  Publishes the .NET Lambda artifact, deploys the environment-scoped CDK stack via GitHub
  OIDC, and returns the resulting API base URL. Reused by ephemeral, dev, and prod deploys.

inputs:
  environment:
    description: "Environment name (dev, prod, pr-123)."
    required: true
  app-version:
    description: "Semantic version embedded into the running app."
    required: true
  aws-region:
    description: "Target AWS region."
    required: true
  role-arn:
    description: "IAM role ARN assumed via GitHub OIDC."
    required: true
  dotnet-version:
    description: ".NET SDK version."
    required: false
    default: "8.0.x"

outputs:
  api-url:
    description: "Base URL of the deployed API."
    value: ${{ steps.resolve-url.outputs.api_url }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup Node (for AWS CDK CLI)
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install AWS CDK CLI
      shell: bash
      run: npm install -g aws-cdk@2

    - name: Publish Lambda artifact
      shell: bash
      run: dotnet publish src/Api/Api.csproj -c Release -o ./publish

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: CDK deploy
      shell: bash
      working-directory: infra
      env:
        LAMBDA_ASSET_PATH: ../publish
      run: |
        cdk deploy \
          --require-approval never \
          -c environment=${{ inputs.environment }} \
          -c appVersion=${{ inputs.app-version }}

    - name: Resolve API URL
      id: resolve-url
      shell: bash
      run: |
        URL=$(aws cloudformation describe-stacks \
          --stack-name "PocApiStack-${{ inputs.environment }}" \
          --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
          --output text)
        if [ -z "$URL" ] || [ "$URL" = "None" ]; then
          echo "::error::Could not resolve ApiUrl output for PocApiStack-${{ inputs.environment }}"
          exit 1
        fi
        echo "api_url=$URL" >> "$GITHUB_OUTPUT"
        echo "Deployed '${{ inputs.environment }}' (version ${{ inputs.app-version }}) -> $URL"
