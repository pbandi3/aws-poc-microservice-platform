# Production release on every push to main (dev->main promotion or hotfix->main).
# Computes a stable SemVer, deploys prod, runs live smoke tests, then tags the commit
# and publishes a GitHub Release. This is the "SemVer + release" half of the demo.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write   # required to create tags and GitHub Releases

env:
  AWS_REGION: us-east-1

jobs:
  test:
    uses: ./.github/workflows/_build-test.yml

  version:
    needs: test
    uses: ./.github/workflows/_version.yml

  deploy:
    name: Deploy to prod
    needs: version
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy prod environment
        id: deploy
        uses: ./.github/actions/deploy
        with:
          environment: prod
          app-version: ${{ needs.version.outputs.majorMinorPatch }}
          aws-region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
      - name: Smoke tests (live)
        env:
          API_BASE_URL: ${{ steps.deploy.outputs.api-url }}
        run: dotnet test tests/Api.SmokeTests/Api.SmokeTests.csproj -c Release
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.version.outputs.majorMinorPatch }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
          else
            # Creates the tag if absent, or reuses an existing (e.g. seeded) tag.
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "${{ github.sha }}" \
              --generate-notes \
              --notes "Automated production release $VERSION deployed to ${{ steps.deploy.outputs.api-url }}"
          fi
      - name: Summary
        run: |
          echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`v${{ needs.version.outputs.majorMinorPatch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.api-url }}" >> "$GITHUB_STEP_SUMMARY"
