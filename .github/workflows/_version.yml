# Reusable workflow: computes the SemVer for the current ref using GitVersion.
# Invokes the GitVersion .NET tool directly (via /showvariable) instead of the
# gittools action, whose opaque JSON parsing is prone to "Output: undefined" failures.
name: Compute Version

on:
  workflow_call:
    outputs:
      semver:
        description: "Full semantic version (may include a pre-release label)."
        value: ${{ jobs.version.outputs.semver }}
      majorMinorPatch:
        description: "Stable MAJOR.MINOR.PATCH (used for release tags)."
        value: ${{ jobs.version.outputs.majorMinorPatch }}

permissions:
  contents: read

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semver }}
      majorMinorPatch: ${{ steps.gv.outputs.majorMinorPatch }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `push` events check out a detached HEAD; give GitVersion a concrete branch to reason about.
      - name: Ensure named branch
        run: git checkout -B "${{ github.ref_name }}"

      # Avoids LibGit2Sharp "repository path is not owned by current user" crashes.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install GitVersion tool
        run: dotnet tool install --global GitVersion.Tool --version '6.*'

      - name: Compute version
        id: gv
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Write the version data to a FILE. GitVersion sends its INFO logs to stdout,
          # so capturing stdout directly would corrupt the parsed value; the file is clean JSON.
          dotnet-gitversion /output file /outputfile gitversion.json /nofetch
          echo "::group::GitVersion output"
          cat gitversion.json
          echo "::endgroup::"
          SEMVER=$(jq -r '.SemVer' gitversion.json)
          MMP=$(jq -r '.MajorMinorPatch' gitversion.json)
          if [ -z "$SEMVER" ] || [ "$SEMVER" = "null" ] || [ -z "$MMP" ] || [ "$MMP" = "null" ]; then
            echo "::error::GitVersion did not produce a valid version"
            exit 1
          fi
          echo "Computed SemVer=$SEMVER MajorMinorPatch=$MMP"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "majorMinorPatch=$MMP" >> "$GITHUB_OUTPUT"
