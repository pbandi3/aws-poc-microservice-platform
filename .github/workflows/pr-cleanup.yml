# Destroys the ephemeral environment when a PR is closed (merged or abandoned),
# keeping the account clean and cost at zero for stale PRs.
name: PR Cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: Destroy ephemeral environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node (for AWS CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2

      # `cdk destroy` synthesizes the app, and Code.FromAsset requires the asset path to
      # exist. Publishing first guarantees a valid synth without a heavy build.
      - name: Publish Lambda artifact (for synth)
        run: dotnet publish src/Api/Api.csproj -c Release -o ./publish

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK destroy
        working-directory: infra
        env:
          LAMBDA_ASSET_PATH: ../publish
        run: |
          cdk destroy \
            --force \
            -c environment=pr-${{ github.event.pull_request.number }} \
            -c appVersion=0.0.0-pr.${{ github.event.pull_request.number }}
